name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # The org's shared CI (graylayer-labs/.github, ci-python.yml). Reports as
    # "checks / checks", the required check on main.
    permissions:
      contents: read
    uses: graylayer-labs/.github/.github/workflows/ci-python.yml@8c9fa19473d67349548fa516aa01fe4753e07003 # v1.0.0
    with:
      coverage-source: post_training
