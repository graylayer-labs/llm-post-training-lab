name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # diff-cover compares with the base branch
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run --locked --with pytest-cov==7.1.0 pytest --cov=post_training --cov-report=xml --cov-report=term
      - name: Coverage of changed lines (80% minimum)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          uvx diff-cover@10.6.0 coverage.xml --compare-branch="origin/$BASE_REF"
          --fail-under=80

  # The org's shared CI (graylayer-labs/.github, ci-python.yml). Reports as
  # "checks / checks". Runs beside the inline job above until main requires
  # "checks / checks" (#50); then the inline job is removed.
  shared:
    name: checks
    permissions:
      contents: read
    uses: graylayer-labs/.github/.github/workflows/ci-python.yml@49eec92db441e22e6717bc02d5262ed78a4aefc6 # pre-release (graylayer-labs/.github#19 head); re-pin to v1.0.0 before merge
    with:
      coverage-source: post_training
